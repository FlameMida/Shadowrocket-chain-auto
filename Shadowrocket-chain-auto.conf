RULE-SET,https://raw.githubusercontent.com/FlameMida/Shadowrocket-chain-auto/main/rules/gfw.list,默认代理
RULE-SET,https://raw.githubusercontent.com/FlameMida/Shadowrocket-chain-auto/main/rules/cn.list,直连
IP-CIDR,192.168.0.0/16,直连,no-resolve
IP-CIDR,10.0.0.0/8,直连,no-resolve
